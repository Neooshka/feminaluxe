server {
    listen 94.228.123.16:443 ssl;
    http2 on;
    server_name feminaluxe.ru www.feminaluxe.ru;

    root  /home/neo/sites/feminaluxe.ru/public;

    ssl_conf_command Options KTLS;
    ssl_certificate /etc/certs/neo/feminaluxe.ru_autorenew_letsen.crt_v2;
    ssl_certificate_key /etc/certs/neo/feminaluxe.ru_autorenew_letsen.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:TLS13-AES-256-GCM-SHA384:ECDHE:!COMPLEMENTOFDEFAULT;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security 'max-age=604800';

    access_log /etc/nginx/vhost_logs/feminaluxe.ru_access;
    error_log /etc/nginx/vhost_logs/feminaluxe.ru_error;

    location ~ /.well-known { allow all; }

    location ~ /\.ht {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {

		proxy_buffer_size 128k;
		proxy_buffers 8 256k;

        index index.php index.html index.htm;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php($|/) {
        fastcgi_split_path_info                 ^(.+?\.php)(/.*)?$;
        try_files                               $fastcgi_script_name /index.php?$query_string;
        fastcgi_pass                            unix:/var/run/php-fpm/php83w-neo.sock;
        include                                 fastcgi_params;
        fastcgi_param                           HTTPS on;

        fastcgi_index                           index.php;
        fastcgi_param   SCRIPT_FILENAME         $document_root$fastcgi_script_name;
        fastcgi_param   PATH_TRANSLATED         $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME             $fastcgi_script_name;

        fastcgi_buffers  16 32k;
        fastcgi_buffer_size  64k;
        fastcgi_busy_buffers_size  68k;
        fastcgi_connect_timeout 180;
        fastcgi_read_timeout 900;
        fastcgi_send_timeout 900;
        fastcgi_cache off;
        fastcgi_cache_key "$request_method|$http_if_modified_since|$http_if_none_match|$host|$request_uri";
        fastcgi_cache_valid 200 10s;
        limit_conn lfcgi 50;

        set             $path_info              $fastcgi_path_info;
        fastcgi_param   PATH_INFO               $path_info;
    }
}
