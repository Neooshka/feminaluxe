server {
    server_name feminaluxe.ru www.feminaluxe.ru;
    root /home/neo/sites/feminaluxe.ru/public;

    index index.php index.html;
    charset utf-8;

    location / {

		proxy_buffer_size 128k;
		proxy_buffers 8 256k;

        index index.php index.html index.htm;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php($|/) {
        fastcgi_split_path_info                 ^(.+?\.php)(/.*)?$;
        try_files                               $fastcgi_script_name /index.php?$query_string;
        fastcgi_pass                            unix:/run/php/php8.5-fpm.sock;
        include                                 fastcgi_params;
        fastcgi_param                           HTTPS on;

        fastcgi_index                           index.php;
        fastcgi_param   SCRIPT_FILENAME         $document_root$fastcgi_script_name;
        fastcgi_param   PATH_TRANSLATED         $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME             $fastcgi_script_name;

        fastcgi_buffers  8 32k;
        fastcgi_buffer_size  4k;
        fastcgi_busy_buffers_size  68k;
        fastcgi_connect_timeout 180;
        fastcgi_read_timeout 900;
        fastcgi_send_timeout 900;
        fastcgi_cache off;
        fastcgi_cache_key "$request_method|$http_if_modified_since|$http_if_none_match|$host|$request_uri";
        fastcgi_cache_valid 200 10s;

        set             $path_info              $fastcgi_path_info;
        fastcgi_param   PATH_INFO               $path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/feminaluxe.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feminaluxe.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security 'max-age=604800';
}

server {
    if ($host = www.feminaluxe.ru) {
        return 301 https://$host$request_uri;
    }


    if ($host = feminaluxe.ru) {
        return 301 https://$host$request_uri;
    }


    listen 80;
    server_name feminaluxe.ru www.feminaluxe.ru;
    return 404;
}