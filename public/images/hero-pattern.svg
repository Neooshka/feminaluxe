
        <defs>
            <!-- Паттерн цветов -->
            <pattern id="flower-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                <!-- Лепестки розы -->
                <path d="M50,30 Q55,15 60,30 Q65,20 70,30 Q65,40 60,50 Q55,40 50,30" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
                <!-- Центр цветка -->
                <circle cx="50" cy="30" r="2" fill="currentColor" opacity="0.4"/>
                <!-- Листья -->
                <path d="M30,70 Q40,60 50,70 Q60,80 50,90 Q40,80 30,70" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.2"/>
                <path d="M70,70 Q60,60 50,70 Q40,80 50,90 Q60,80 70,70" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.2"/>
            </pattern>

            <!-- Паттерн сердечек -->
            <pattern id="heart-pattern" x="20" y="20" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M20,15 C15,10 5,10 5,20 C5,30 20,35 20,35 C20,35 35,30 35,20 C35,10 25,10 20,15Z" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.2"/>
            </pattern>

            <!-- Паттерн завитков -->
            <pattern id="swirl-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                <path d="M40,40 Q50,30 60,40 Q70,50 60,60 Q50,70 40,60 Q30,50 40,40" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>
                <path d="M40,40 Q45,35 50,40 Q55,45 50,50 Q45,55 40,50 Q35,45 40,40" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.1"/>
            </pattern>

            <!-- Градиент для плавного перехода -->
            <radialGradient id="fade-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Основной фон с несколькими паттернами -->
        <rect width="100%" height="100%" fill="url(#flower-pattern)"/>
        <rect width="100%" height="100%" fill="url(#heart-pattern)"/>
        <rect width="100%" height="100%" fill="url(#swirl-pattern)"/>

        <!-- Декоративные элементы по краям -->
        <!-- Левый верхний угол -->
        <path d="M0,0 Q50,0 0,50" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        <path d="M0,0 Q25,25 50,0" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>

        <!-- Правый верхний угол -->
        <path d="M800,0 Q750,0 800,50" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        <path d="M800,0 Q775,25 750,0" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>

        <!-- Левый нижний угол -->
        <path d="M0,600 Q0,550 50,600" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        <path d="M0,600 Q25,575 50,600" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>

        <!-- Правый нижний угол -->
        <path d="M800,600 Q800,550 750,600" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        <path d="M800,600 Q775,575 750,600" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>

        <!-- Большие цветы в углах -->
        <!-- Верхний левый большой цветок -->
        <g transform="translate(100, 100) scale(1.5)">
            <path d="M0,0 Q15,-10 30,0 Q45,10 30,20 Q15,30 0,20 Q-15,10 0,0" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
            <circle cx="0" cy="0" r="3" fill="currentColor" opacity="0.2"/>
        </g>

        <!-- Нижний правый большой цветок -->
        <g transform="translate(700, 500) scale(1.5)">
            <path d="M0,0 Q15,-10 30,0 Q45,10 30,20 Q15,30 0,20 Q-15,10 0,0" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
            <circle cx="0" cy="0" r="3" fill="currentColor" opacity="0.2"/>
        </g>

        <!-- Центральные декоративные элементы -->
        <circle cx="400" cy="300" r="150" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.05"/>
        <circle cx="400" cy="300" r="100" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.07"/>
        <circle cx="400" cy="300" r="50" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.1"/>

        <!-- Волнистые линии по диагоналям -->
        <path d="M0,0 C200,100 400,50 600,150 800,250" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.03"/>
        <path d="M800,0 C600,100 400,50 200,150 0,250" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.03"/>
        <path d="M0,600 C200,500 400,550 600,450 800,350" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.03"/>
        <path d="M800,600 C600,500 400,550 200,450 0,350" fill="none" stroke="currentColor" stroke-width="0.2" opacity="0.03"/>

        <!-- Градиентное затемнение от центра к краям -->
        <rect width="100%" height="100%" fill="url(#fade-gradient)"/>

        <!-- Мелкие звездочки/искорки -->
        <g opacity="0.1">
            <circle cx="200" cy="150" r="1" fill="currentColor"/>
            <circle cx="350" cy="80" r="0.8" fill="currentColor"/>
            <circle cx="500" cy="200" r="1.2" fill="currentColor"/>
            <circle cx="650" cy="100" r="0.7" fill="currentColor"/>
            <circle cx="100" cy="400" r="0.9" fill="currentColor"/>
            <circle cx="250" cy="500" r="1.1" fill="currentColor"/>
            <circle cx="700" cy="450" r="0.6" fill="currentColor"/>
            <circle cx="600" cy="550" r="0.8" fill="currentColor"/>
            <circle cx="150" cy="250" r="1" fill="currentColor"/>
            <circle cx="300" cy="350" r="0.7" fill="currentColor"/>
            <circle cx="450" cy="450" r="0.9" fill="currentColor"/>
            <circle cx="550" cy="300" r="1.1" fill="currentColor"/>
        </g>
    </svg>
