<svg class="w-full h-full" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Градиенты для beauty-тематики -->
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.1"/>
        </linearGradient>

        <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.2"/>
        </linearGradient>

        <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff1f2" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#fdf2f8" stop-opacity="0.3"/>
        </radialGradient>

        <!-- Паттерн для текстуры -->
        <pattern id="texture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="0.5" fill="#f43f5e" opacity="0.05"/>
            <circle cx="5" cy="5" r="0.3" fill="#ec4899" opacity="0.03"/>
            <circle cx="15" cy="15" r="0.4" fill="#a855f7" opacity="0.03"/>
        </pattern>
    </defs>

    <!-- Фоновые формы -->
    <rect width="400" height="300" fill="url(#grad3)"/>

    <!-- Абстрактное лицо (силуэт) -->
    <ellipse cx="200" cy="150" rx="120" ry="160" fill="white" opacity="0.2" stroke="#fecdd3" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Абстрактные брови (пластичные линии) -->
    <path d="M120,100 C140,90 160,95 180,100" stroke="#a855f7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M220,100 C240,95 260,90 280,100" stroke="#a855f7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Абстрактные глаза (минимализм) -->
    <ellipse cx="150" cy="140" rx="15" ry="8" fill="#f3e8ff" opacity="0.6" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    <ellipse cx="250" cy="140" rx="15" ry="8" fill="#f3e8ff" opacity="0.6" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Абстрактные ресницы -->
    <g opacity="0.3">
        <path d="M135,130 L130,115" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M140,128 L138,110" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M145,130 L148,115" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>

        <path d="M265,130 L270,115" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M260,128 L262,110" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M255,130 L252,115" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Абстрактные губы (мягкий контур) -->
    <path d="M160,200 C180,190 220,190 240,200 C220,210 180,210 160,200"
          fill="url(#grad1)"
          stroke="#f43f5e"
          stroke-width="2"
          stroke-opacity="0.4"/>

    <!-- Декоративные элементы - лепестки/цветы -->
    <g opacity="0.3">
        <!-- Лепесток 1 -->
        <ellipse cx="80" cy="80" rx="25" ry="12" transform="rotate(45 80 80)" fill="#f0abfc" opacity="0.2"/>
        <!-- Лепесток 2 -->
        <ellipse cx="320" cy="80" rx="25" ry="12" transform="rotate(-45 320 80)" fill="#f0abfc" opacity="0.2"/>
        <!-- Лепесток 3 -->
        <ellipse cx="320" cy="220" rx="25" ry="12" transform="rotate(45 320 220)" fill="#f0abfc" opacity="0.2"/>
        <!-- Лепесток 4 -->
        <ellipse cx="80" cy="220" rx="25" ry="12" transform="rotate(-45 80 220)" fill="#f0abfc" opacity="0.2"/>
    </g>

    <!-- Абстрактные завитки (украшения) -->
    <g opacity="0.2">
        <path d="M50,50 Q70,30 90,50 Q110,70 90,90 Q70,110 50,90 Q30,70 50,50"
              fill="none"
              stroke="#ec4899"
              stroke-width="1"/>

        <path d="M350,250 Q330,230 310,250 Q290,270 310,290 Q330,310 350,290 Q370,270 350,250"
              fill="none"
              stroke="#ec4899"
              stroke-width="1"/>
    </g>

    <!-- Блестки/искорки -->
    <g opacity="0.4">
        <!-- Звездочки -->
        <polygon points="60,150 63,160 73,160 65,165 68,175 60,170 52,175 55,165 47,160 57,160"
                fill="#fbbf24" opacity="0.3"/>

        <polygon points="340,150 343,160 353,160 345,165 348,175 340,170 332,175 335,165 327,160 337,160"
                fill="#fbbf24" opacity="0.3"/>

        <!-- Точки-блестки -->
        <circle cx="100" cy="180" r="2" fill="#ffffff" opacity="0.6"/>
        <circle cx="300" cy="120" r="1.5" fill="#ffffff" opacity="0.6"/>
        <circle cx="180" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
        <circle cx="220" cy="240" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Текстура поверх всего -->
    <rect width="400" height="300" fill="url(#texture)" opacity="0.1"/>

    <!-- Текстовая метка (опционально) -->
    <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" opacity="0.5">
        Feminaluxe • Перманентный макияж
    </text>
</svg>
